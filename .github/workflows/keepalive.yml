name: Keep API awake

# Render's free plan sleeps after ~15 minutes idle. Pinging /health every
# 10 minutes keeps it awake so calls don't hit a 30-60s cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://scenario-api-0wix.onrender.com/health
